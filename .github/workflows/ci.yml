# The checks on Linux, and on Windows what Linux cannot show: the window's GL contexts, ANGLE's and
# WGL's, and its MSI, built with jpackage and installed, upgraded and removed.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # ffmpeg for the window's feed; Mesa's EGL and llvmpipe for its GL tests, as the runner has no GPU.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
      - run: ./gradlew check
      # The deb in a bare Ubuntu 20.04, the oldest release its dependencies are named for.
      - name: Build the deb and try it
        run: |
          sudo apt-get install -y fakeroot
          ./gradlew :desktop:packageDeb
          tools/test_deb.sh desktop/build/compose/binaries/main/deb/dog-vision_0.1.0_amd64.deb ubuntu:20.04
      # The rpm in a bare Fedora, with no desktop.
      - name: Build the rpm and try it
        run: |
          sudo apt-get install -y rpm
          ./gradlew :desktop:packageRpm
          tools/test_rpm.sh desktop/build/compose/binaries/main/rpm/dog-vision-0.1.0-1.x86_64.rpm fedora:42
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-reports
          path: |
            **/build/reports/
            **/hs_err_pid*.log

  windows-gl:
    name: Windows GL tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      # Windows's own opengl32.dll has OpenGL 1.1 alone, where WglContext asks for 3.3 core: Mesa's
      # llvmpipe, beside java.exe, which Windows loads a DLL from before its system folder. Its WGL
      # alone: Mesa's libEGL and libGLESv2 there could be taken for ANGLE's, which have their names.
      - name: Put Mesa's OpenGL beside java.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa "x64/*.dll" | Out-Null
          Write-Host "Mesa's DLLs: $((Get-ChildItem mesa/x64).Name -join ', ')"
          foreach ($dll in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") {
            if (Test-Path "mesa/x64/$dll") { Copy-Item "mesa/x64/$dll" (Join-Path $env:JAVA_HOME "bin") }
          }
      # ANGLE runs on Direct3D 11's software rasteriser, WARP, as the runner has no GPU. Mesa would
      # take its Direct3D 12 driver, which needs Mesa's dxil.dll, over llvmpipe.
      - run: ./gradlew :desktop:jvmTest
        env:
          GALLIUM_DRIVER: llvmpipe
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-gl-reports
          path: |
            desktop/build/reports/
            desktop/build/test-results/
            desktop/hs_err_pid*.log

  windows-msi:
    name: Windows MSI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # WiX Toolset 3.14 comes with the runner's image, which names it by WIX.
      - name: Build the MSI and a later version of it
        shell: pwsh
        run: |
          ./tools/package_msi_on_windows.ps1
          ./tools/package_msi_on_windows.ps1 -AppVersion 0.1.1
      - name: Install, upgrade and remove it
        shell: pwsh
        run: >-
          ./tools/test_msi_on_windows.ps1
          -Msi desktop/build/compose/binaries/main/msi/0.1.0/dog-vision-0.1.0.msi -Version 0.1.0
          -UpgradeMsi desktop/build/compose/binaries/main/msi/0.1.1/dog-vision-0.1.1.msi -UpgradeVersion 0.1.1
          -LogDir msi-logs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-msi
          path: |
            desktop/build/compose/binaries/main/msi/
            msi-logs/

  # Trials, on spike alone: what the window's ffmpeg button relies on, which only a Windows with
  # winget shows, on both images, as neither's list of its software names winget.
  windows-winget:
    name: Trial - ffmpeg through winget (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: winget --version
      # No ffmpeg is installed first; the trial installs it.
      - run: ./gradlew :desktop:jvmTest --tests cz.loplex.dogvision.desktop.FfmpegWingetTrial
        env:
          DOG_VISION_INSTALL_FFMPEG: 1
      # winget's own bytes through a pipe, as the window reads them, installed already this time;
      # its status is not the point, so the step does not fail the job.
      - if: always()
        continue-on-error: true
        shell: cmd
        run: >-
          winget install --id Gyan.FFmpeg --exact --source winget --scope user
          --disable-interactivity --accept-package-agreements --accept-source-agreements
          > winget-output.bin 2>&1
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trial-winget-${{ matrix.image }}
          path: |
            winget-output.bin
            desktop/build/reports/
            desktop/build/test-results/

  # Trial, on spike alone: what the MSI built on Windows carries of the C and C++ runtimes, which
  # the window's natives, linked statically, and the runtime's own DLLs take.
  windows-msi-runtime:
    name: Trial - the Windows-built MSI's runtime DLLs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the MSI and unpack it
        shell: pwsh
        run: |
          ./tools/package_msi_on_windows.ps1
          $msi = (Resolve-Path desktop/build/compose/binaries/main/msi/0.1.0/dog-vision-0.1.0.msi).Path
          $target = Join-Path $PWD "msi-unpacked"
          Start-Process msiexec -Wait -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`""
          $all = Get-ChildItem -Recurse -File $target
          Write-Host "files: $($all.Count)"
          $missing = @()
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "ucrtbase.dll",
                           "api-ms-win-crt-runtime-l1-1-0.dll", "jvm.dll") {
            $found = $all | Where-Object Name -eq $dll
            if ($found) { Write-Host "ok: $dll at $($found[0].FullName.Substring($target.Length))" }
            else { Write-Host "MISSING: $dll"; $missing += $dll }
          }
          if ($missing) { exit 1 }

  # Trial, on spike alone: the MSI built under Wine on Linux, validated on Windows, as WiX 3.14's
  # smoke.exe fails under Wine (SMOK0216, Win32 error 0x65B). Two versions, for the upgrade.
  wine-msi:
    name: Trial - the MSI built under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WINEPREFIX: ${{ github.workspace }}/../wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      # Wine's menu builder would write the shortcuts into the runner's home.
      WINEDLLOVERRIDES: winemenubuilder.exe=d
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Ubuntu 24.04's own Wine is 9.0; the script was made with WineHQ's 11.18 Staging.
      - name: Install WineHQ's Wine Staging and winetricks
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -q -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-staging xvfb cabextract
          wine --version
          sudo wget -q -O /usr/local/bin/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks
          sudo chmod +x /usr/local/bin/winetricks
      # wineboot would wait for Wine Mono's and Gecko's installer dialog on the virtual display, and
      # the prefix be left without its DLLs; .NET Framework 4.8 replaces Mono anyway. Only there, as
      # mscoree disabled would keep .NET from running.
      - name: Put .NET Framework 4.8 into the prefix
        run: |
          WINEDLLOVERRIDES="mscoree,mshtml=;$WINEDLLOVERRIDES" xvfb-run -a wineboot --init
          wineserver -w
          test -f "$WINEPREFIX/drive_c/windows/system32/kernel32.dll"
          xvfb-run -a winetricks -q dotnet48
          wineserver -w
      # jpackage.exe from a Windows JDK 17, the runtime from the jmods of the Windows JDK of this
      # jlink's version, and WiX 3.14's binaries.
      - name: Download the Windows JDK 17, the Windows JDK 25's jmods and WiX 3.14
        run: |
          # 25.0.4+1-LTS, as java names it, is Adoptium's release jdk-25.0.4+1.
          version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p')"
          version="${version%%-*}"
          echo "jlink's JDK: $version"
          mkdir -p "$RUNNER_TEMP/windows"
          cd "$RUNNER_TEMP/windows"
          curl -sSfL -o jdk17.zip https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse
          curl -sSfL -o jmods.zip "https://api.adoptium.net/v3/binary/version/jdk-${version/+/%2B}/windows/x64/jmods/hotspot/normal/eclipse"
          curl -sSfL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          unzip -q jdk17.zip -d jdk17 && unzip -q jmods.zip -d jmods && unzip -q wix.zip -d wix
          echo "JDK17=$(echo "$PWD"/jdk17/*)" >> "$GITHUB_ENV"
          echo "JMODS=$(dirname "$(find "$PWD/jmods" -name java.base.jmod)")" >> "$GITHUB_ENV"
          echo "WIX=$PWD/wix" >> "$GITHUB_ENV"
      - name: Build the MSI and a later version of it
        run: |
          xvfb-run -a tools/package_msi_on_linux.sh --jdk "$JDK17" --jmods "$JMODS" --wix "$WIX"
          mkdir -p wine-msi
          mv desktop/build/compose/binaries/main/msi/dog-vision-0.1.0.msi wine-msi/
          sed -i 's/packageVersion = "0.1.0"/packageVersion = "0.1.1"/' desktop/build.gradle.kts
          xvfb-run -a tools/package_msi_on_linux.sh --jdk "$JDK17" --jmods "$JMODS" --wix "$WIX"
          mv desktop/build/compose/binaries/main/msi/dog-vision-0.1.1.msi wine-msi/
          git checkout desktop/build.gradle.kts
          ls -l wine-msi
      - uses: actions/upload-artifact@v5
        with:
          name: wine-msi
          path: wine-msi/

  wine-msi-on-windows:
    name: Trial - the MSI built under Wine, on Windows
    needs: wine-msi
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: wine-msi
          path: wine-msi
      # WiX Toolset 3.14 comes with the runner's image, which names it by WIX. Less ICE27, as
      # jpackage's own run of light.exe leaves it out.
      - name: Validate each MSI with smoke.exe
        shell: pwsh
        run: |
          $failed = 0
          foreach ($msi in Get-ChildItem wine-msi/*.msi) {
            & (Join-Path $env:WIX "bin\smoke.exe") -nologo -sice:ICE27 $msi.FullName
            Write-Host "smoke.exe $($msi.Name): $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed
      # The MSI built under Wine gives dog-vision-cli shortcuts, which the script's checks refuse, so
      # its status does not fail the job; its log says which checks held.
      - name: Install, upgrade and remove it
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >-
          ./tools/test_msi_on_windows.ps1
          -Msi wine-msi/dog-vision-0.1.0.msi -Version 0.1.0
          -UpgradeMsi wine-msi/dog-vision-0.1.1.msi -UpgradeVersion 0.1.1
          -LogDir msi-logs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wine-msi-logs
          path: msi-logs/
