# The MSIs that tools/package_msi_on_linux.sh builds under Wine, each window's in two versions,
# validated and installed on Windows: WiX 3.14's smoke.exe fails under Wine (SMOK0216, Win32 error 0x65B), so
# only Windows can validate it. It installs Wine and .NET Framework 4.8 each time and depends on
# WineHQ's packages and winetricks, so it runs when started by hand, not on every push as ci.yml
# does.
name: MSI built under Wine

on:
  workflow_dispatch:

jobs:
  build:
    name: The MSI built under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WINEPREFIX: ${{ github.workspace }}/../wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      # Wine's menu builder would write the shortcuts into the runner's home.
      WINEDLLOVERRIDES: winemenubuilder.exe=d
      # One virtual display for the whole job, which a step starts: xvfb-run ends its display after
      # each command, with Wine's processes still on it, and wineserver -w then waits for them for
      # ever.
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Ubuntu 24.04's own Wine is 9.0; the script was made with WineHQ's 11.18 Staging.
      - name: Install WineHQ's Wine Staging and winetricks
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -q -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-staging xvfb cabextract
          # The locale package_msi_on_linux.sh runs Wine in, for the vendor's ř.
          sudo locale-gen cs_CZ.UTF-8
          wine --version
          sudo wget -q -O /usr/local/bin/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks
          sudo chmod +x /usr/local/bin/winetricks
      - name: Start the virtual display
        run: Xvfb :99 -screen 0 1280x1024x24 &
      # Without Mono and Gecko, whose installer wineboot otherwise waits on, on the virtual
      # display, and leaves the prefix without its DLLs; .NET Framework 4.8 replaces Mono anyway.
      # For wineboot alone, as mscoree disabled would keep .NET from running.
      - name: Put .NET Framework 4.8 into the prefix
        timeout-minutes: 40
        run: |
          WINEDLLOVERRIDES="mscoree,mshtml=;$WINEDLLOVERRIDES" wineboot --init
          wineserver -w
          test -f "$WINEPREFIX/drive_c/windows/system32/kernel32.dll"
          winetricks -q dotnet48
          wineserver -w
      # jpackage.exe from a Windows JDK 17, the runtime from the jmods of the Windows JDK of this
      # jlink's version, and WiX 3.14's binaries.
      - name: Download the Windows JDK 17, the Windows JDK 25's jmods and WiX 3.14
        run: |
          # 25.0.4+1-LTS, as java names it, is Adoptium's release jdk-25.0.4+1.
          version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p')"
          version="${version%%-*}"
          echo "jlink's JDK: $version"
          mkdir -p "$RUNNER_TEMP/windows"
          cd "$RUNNER_TEMP/windows"
          curl -sSfL -o jdk17.zip https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse
          curl -sSfL -o jmods.zip "https://api.adoptium.net/v3/binary/version/jdk-${version/+/%2B}/windows/x64/jmods/hotspot/normal/eclipse"
          curl -sSfL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          unzip -q jdk17.zip -d jdk17 && unzip -q jmods.zip -d jmods && unzip -q wix.zip -d wix
          echo "JDK17=$(echo "$PWD"/jdk17/*)" >> "$GITHUB_ENV"
          echo "JMODS=$(dirname "$(find "$PWD/jmods" -name java.base.jmod)")" >> "$GITHUB_ENV"
          echo "WIX=$PWD/wix" >> "$GITHUB_ENV"
      - name: Build the MSIs
        run: |
          for window in compose swing; do
            tools/package_msi_on_linux.sh --jdk "$JDK17" --jmods "$JMODS" --wix "$WIX" --window "$window"
            tools/package_msi_on_linux.sh --jdk "$JDK17" --jmods "$JMODS" --wix "$WIX" --window "$window" \
              --app-version 0.1.1
          done
          mkdir -p wine-msi
          mv desktop/build/compose/binaries/main/msi/dog-vision-0.1.{0,1}.msi wine-msi/
          mv swing/build/packages/msi/dog-vision-swing-0.1.{0,1}.msi wine-msi/
          ls -l wine-msi
      - uses: actions/upload-artifact@v5
        with:
          name: wine-msi
          path: wine-msi/

  on-windows:
    name: The MSI built under Wine, on Windows
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: wine-msi
          path: wine-msi
      # WiX Toolset 3.14 comes with the runner's image, which names it by WIX. Less ICE27, as
      # jpackage's own run of light.exe leaves it out.
      - name: Validate each MSI with smoke.exe
        shell: pwsh
        run: |
          $failed = 0
          foreach ($msi in Get-ChildItem wine-msi/*.msi) {
            & (Join-Path $env:WIX "bin\smoke.exe") -nologo -sice:ICE27 $msi.FullName
            Write-Host "smoke.exe $($msi.Name): $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed
      - name: Install, upgrade and remove dog-vision's
        if: always()
        shell: pwsh
        run: >-
          ./tools/test_msi_on_windows.ps1
          -Msi wine-msi/dog-vision-0.1.0.msi -Version 0.1.0
          -UpgradeMsi wine-msi/dog-vision-0.1.1.msi -UpgradeVersion 0.1.1
          -LogDir msi-logs/dog-vision -BuiltUnderWine
      - name: Install, upgrade and remove dog-vision-swing's
        if: always()
        shell: pwsh
        run: >-
          ./tools/test_msi_on_windows.ps1 -Name dog-vision-swing
          -Msi wine-msi/dog-vision-swing-0.1.0.msi -Version 0.1.0
          -UpgradeMsi wine-msi/dog-vision-swing-0.1.1.msi -UpgradeVersion 0.1.1
          -LogDir msi-logs/dog-vision-swing -BuiltUnderWine
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wine-msi-logs
          path: msi-logs/
