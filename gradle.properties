org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/JS installs its npm packages with npm, which comes with Node.js, instead of downloading Yarn as well.
kotlin.js.yarn=false

# The app's version: the Android app's versionName, and the desktop window's in its packages and MSI. A test of an
# upgrade builds a later one with -PappVersion=<version>.
appVersion=0.1.0
