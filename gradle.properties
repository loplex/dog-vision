org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/JS installs its npm packages with npm, which comes with Node.js, instead of downloading Yarn as well.
kotlin.js.yarn=false

# detekt analyses in a process of its own.
# Inside the Gradle daemon, where it runs by default,
# its Kotlin analysis can keep what it read of a module's jar in one build for the next,
# and then report a class added to that jar since as an unresolved reference.
detekt.use.worker.api=true

# The app's version: the Android app's versionName, and the desktop window's in its packages and MSI.
# A test of an upgrade builds a later one with -PappVersion=<version>.
appVersion=0.1.0
