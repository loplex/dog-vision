# jpackage's second launcher, dog-vision-cli: the command line alone, which prints its usage rather than open the
# window when given nothing, and on Windows runs in a console, as the window's launcher does not. It gets no entry in
# the Linux desktop's menu, nor in Windows's Start menu or on its desktop, where it would only print its usage;
# jpackage takes the two Windows keys from JDK 18 on, and JDK 17's, which package_msi_on_linux.sh runs, passes over
# them.
main-class=cz.loplex.dogvision.cli.MainKt
win-console=true
win-menu=false
win-shortcut=false
linux-shortcut=false
